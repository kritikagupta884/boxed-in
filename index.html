<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boxed In</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Caveat:wght@600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
  :root{
    --paper:#FBFAF5;
    --graph:#DCE6EF;
    --card:#FFFFFF;
    --ink:#28313C;
    --ink-soft:#5C6873;
    --ink-faint:#93A0AC;
    --dot:#39434E;
    --line-idle:#CBD6E0;
    --rule:#E3E9EF;
    --btn:#30588C;
    --btn-ink:#FFFFFF;
    --shadow:0 2px 10px rgba(40,49,60,.08);
    --turn:#E4572E;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B222B;
      --graph:#28323E;
      --card:#232D38;
      --ink:#EAEFF4;
      --ink-soft:#A2AFBC;
      --ink-faint:#6E7B88;
      --dot:#DCE4EC;
      --line-idle:#3B4855;
      --rule:#33404D;
      --btn:#7FA8D9;
      --btn-ink:#14202E;
      --shadow:0 2px 12px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B222B;
    --graph:#28323E;
    --card:#232D38;
    --ink:#EAEFF4;
    --ink-soft:#A2AFBC;
    --ink-faint:#6E7B88;
    --dot:#DCE4EC;
    --line-idle:#3B4855;
    --rule:#33404D;
    --btn:#7FA8D9;
    --btn-ink:#14202E;
    --shadow:0 2px 12px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    color:var(--ink);
    font-family:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
    background:
      linear-gradient(var(--graph) 1px, transparent 1px),
      linear-gradient(90deg, var(--graph) 1px, transparent 1px),
      var(--paper);
    background-size:28px 28px, 28px 28px, auto;
    min-height:100vh;
  }
  main{max-width:1060px;margin:0 auto;padding:28px 20px 56px}

  h1{
    font-family:"Caprasimo", "Georgia", serif;
    font-weight:400;
    font-size:clamp(2.2rem,5vw,3.2rem);
    letter-spacing:.5px;
    margin:0;
    text-wrap:balance;
  }
  .tagline{color:var(--ink-soft);margin:6px 0 0;font-size:1.02rem}
  header.masthead{text-align:center;margin-bottom:26px}

  /* ---------- setup ---------- */
  .setup-card{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:14px;
    box-shadow:var(--shadow);
    max-width:560px;
    margin:0 auto;
    padding:26px 28px 30px;
  }
  .step-label{
    font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-faint);margin:22px 0 10px;
  }
  .step-label:first-child{margin-top:0}
  .stepper{display:flex;align-items:center;gap:16px}
  .stepper button{
    width:40px;height:40px;border-radius:50%;
    border:1.5px solid var(--rule);background:var(--card);color:var(--ink);
    font-size:1.3rem;font-weight:800;cursor:pointer;line-height:1;
  }
  .stepper button:hover{border-color:var(--btn)}
  .stepper button:focus-visible, .len-card:focus-visible, .btn:focus-visible,
  .name-row input:focus-visible, .ghost-btn:focus-visible, .me-row select:focus-visible{
    outline:2px solid var(--btn);outline-offset:2px;
  }
  .stepper .count{
    font-family:"Caprasimo",serif;font-size:1.8rem;min-width:2ch;text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .names{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .name-row{display:flex;align-items:center;gap:12px}
  .swatch{
    width:26px;height:26px;border-radius:7px;flex:none;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.12);
  }
  .name-row input{
    flex:1;padding:10px 12px;border-radius:9px;
    border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);
    font:inherit;font-weight:600;
  }
  .name-row input::placeholder{color:var(--ink-faint)}
  .hint{font-size:.85rem;color:var(--ink-soft);margin:10px 0 0}

  .len-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .len-card{
    border:1.5px solid var(--rule);border-radius:11px;background:var(--paper);
    color:var(--ink);padding:14px 10px;cursor:pointer;text-align:center;font:inherit;
  }
  .len-card .mins{font-family:"Caprasimo",serif;font-size:1.5rem;display:block}
  .len-card .dots-info{display:block;font-size:.8rem;color:var(--ink-soft);margin-top:4px}
  .len-card[aria-pressed="true"]{
    border-color:var(--btn);
    box-shadow:0 0 0 1.5px var(--btn) inset;
  }
  .btn{
    display:block;width:100%;margin-top:26px;padding:14px;
    border:none;border-radius:11px;cursor:pointer;
    background:var(--btn);color:var(--btn-ink);
    font-family:"Caprasimo",serif;font-size:1.15rem;letter-spacing:.4px;
  }
  .btn:hover{filter:brightness(1.08)}

  /* ---------- game ---------- */
  #screen-game{display:none}
  .game-wrap{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
  .board-col{flex:1 1 420px;max-width:660px;min-width:300px}
  .board-frame{
    position:relative;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:12px;
  }
  svg#board{display:block;width:100%;height:auto;touch-action:manipulation}

  .turn-banner{
    display:flex;align-items:center;gap:10px;justify-content:center;
    margin:0 0 12px;font-weight:700;font-size:1.05rem;
  }
  .turn-banner .swatch{width:18px;height:18px;border-radius:5px}
  .turn-banner .turn-name{font-family:"Caveat",cursive;font-size:1.5rem;font-weight:700}

  /* board pieces */
  .edge .hit{stroke:transparent;stroke-width:22;cursor:pointer}
  .edge .stroke{
    stroke:transparent;stroke-width:7;stroke-linecap:round;pointer-events:none;
  }
  .edge:not(.owned):hover .stroke,
  .edge:not(.owned) .hit:focus-visible + .stroke{stroke:var(--turn);opacity:.4}
  .edge.owned .hit{cursor:default}
  .edge .hit:focus{outline:none}
  circle.dot{fill:var(--dot)}
  .box-initial{
    font-family:"Caveat",cursive;font-weight:700;
    user-select:none;pointer-events:none;
  }

  /* score panel */
  .panel{
    flex:0 1 280px;min-width:250px;
    background:var(--card);border:1px solid var(--rule);border-radius:14px;
    box-shadow:var(--shadow);padding:18px 18px 20px;
  }
  .panel h2{
    margin:0 0 4px;font-family:"Caprasimo",serif;font-weight:400;font-size:1.25rem;
  }
  .claimed-note{font-size:.83rem;color:var(--ink-soft);margin:0 0 10px;font-variant-numeric:tabular-nums}
  .mode-note{
    font-size:.78rem;color:var(--ink-soft);margin:0 0 12px;
    padding:7px 10px;border-radius:8px;background:var(--paper);border:1px dashed var(--rule);
  }
  .mode-note.live{border-style:solid}
  .me-row{
    display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:.85rem;font-weight:700;
  }
  .me-row select{
    flex:1;padding:7px 8px;border-radius:8px;border:1.5px solid var(--rule);
    background:var(--paper);color:var(--ink);font:inherit;font-weight:600;font-size:.85rem;
  }
  .pcard{
    border:1.5px solid var(--rule);border-radius:11px;padding:10px 12px;margin-bottom:10px;
    transition:border-color .2s, box-shadow .2s;
  }
  .pcard.active{border-color:var(--pc);box-shadow:0 0 0 1.5px var(--pc) inset}
  .pcard .rowtop{display:flex;align-items:center;gap:10px}
  .pcard .swatch{width:20px;height:20px;border-radius:6px}
  .pcard .pname{font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pcard .score{
    font-family:"Caprasimo",serif;font-size:1.5rem;font-variant-numeric:tabular-nums;
    min-width:1.5ch;text-align:right;
  }
  .pcard .tally{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px;min-height:8px}
  .pcard .tally i{width:8px;height:8px;border-radius:2px;background:var(--pc);display:block}
  .pcard .turn-tag{
    display:none;font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--pc);margin-top:6px;
  }
  .pcard.active .turn-tag{display:block}
  .ghost-btn{
    display:block;width:100%;margin-top:8px;padding:10px;border-radius:10px;cursor:pointer;
    background:none;border:1.5px solid var(--rule);color:var(--ink-soft);font:inherit;font-weight:700;
  }
  .ghost-btn:hover{border-color:var(--btn);color:var(--ink)}

  /* toast */
  #toast{
    position:fixed;left:50%;top:22px;transform:translate(-50%,-16px);
    background:var(--ink);color:var(--paper);
    padding:10px 22px;border-radius:999px;box-shadow:var(--shadow);
    font-family:"Caveat",cursive;font-size:1.45rem;font-weight:700;
    opacity:0;pointer-events:none;z-index:60;white-space:nowrap;
    transition:opacity .18s, transform .18s;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast .plus{color:var(--toast-c,#FFD166);margin-left:6px}

  .particle{position:absolute;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:50}

  /* game over */
  #overlay{
    position:fixed;inset:0;background:rgba(20,26,33,.55);
    display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  #overlay.show{display:flex}
  .over-card{
    background:var(--card);border:1px solid var(--rule);border-radius:18px;
    box-shadow:var(--shadow);padding:30px 32px;max-width:420px;width:100%;text-align:center;
  }
  .over-card h2{font-family:"Caprasimo",serif;font-weight:400;font-size:2rem;margin:0}
  .winner-line{font-family:"Caveat",cursive;font-size:1.7rem;font-weight:700;margin:6px 0 18px}
  .standings{list-style:none;padding:0;margin:0 0 8px;text-align:left}
  .standings li{
    display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--rule);
    font-weight:700;font-variant-numeric:tabular-nums;
  }
  .standings li:last-child{border-bottom:none}
  .standings .swatch{width:16px;height:16px;border-radius:5px}
  .standings .s-name{flex:1}
  .over-card .btn{margin-top:16px}
  .over-card .ghost-btn{margin-top:10px}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>
<main>
  <header class="masthead">
    <h1>Boxed In</h1>
    <p class="tagline">Dots &amp; squares, straight off the back page of a maths notebook.</p>
  </header>

  <!-- SETUP -->
  <section id="screen-setup" aria-label="Game setup">
    <div class="setup-card">
      <div class="step-label">1 · Players</div>
      <div class="stepper">
        <button type="button" id="minus" aria-label="Fewer players">−</button>
        <span class="count" id="pcount">2</span>
        <button type="button" id="plus" aria-label="More players">+</button>
        <span class="hint" style="margin:0">2–6 players</span>
      </div>
      <div class="names" id="names"></div>
      <p class="hint">Colours are dealt at random — no swapping, no sulking.</p>

      <div class="step-label">2 · Length of game</div>
      <div class="len-grid" id="lenGrid">
        <button type="button" class="len-card" data-dots="6" aria-pressed="true">
          <span class="mins">10 min</span><span class="dots-info">6×6 dots · 25 squares</span>
        </button>
        <button type="button" class="len-card" data-dots="8" aria-pressed="false">
          <span class="mins">15 min</span><span class="dots-info">8×8 dots · 49 squares</span>
        </button>
        <button type="button" class="len-card" data-dots="10" aria-pressed="false">
          <span class="mins">20 min</span><span class="dots-info">10×10 dots · 81 squares</span>
        </button>
      </div>

      <button type="button" class="btn" id="startBtn">Start the game</button>
      <p class="hint">One person sets up the game — everyone else on this link joins automatically.</p>
    </div>
  </section>

  <!-- GAME -->
  <section id="screen-game" aria-label="Game board">
    <div class="turn-banner" id="turnBanner"></div>
    <div class="game-wrap">
      <div class="board-col">
        <div class="board-frame" id="boardFrame">
          <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </div>
      <aside class="panel" aria-label="Scores">
        <h2>Scorecard</h2>
        <p class="claimed-note" id="claimedNote"></p>
        <p class="mode-note" id="modeNote">Connecting…</p>
        <label class="me-row">I'm playing as
          <select id="meSel"></select>
        </label>
        <div id="pcards"></div>
        <button type="button" class="ghost-btn" id="restartBtn">↺ Back to setup</button>
      </aside>
    </div>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<div id="overlay">
  <div class="over-card">
    <h2 id="overTitle">Game over</h2>
    <p class="winner-line" id="winnerLine"></p>
    <ol class="standings" id="standings"></ol>
    <button type="button" class="btn" id="againBtn">Play again — same players</button>
    <button type="button" class="ghost-btn" id="newBtn">New game</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  const COLORS = ["#E4572E","#2E86AB","#379956","#8A4FD3","#D81E77","#0F8B8D"];
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id)=>document.getElementById(id);

  /* ---------- live sync over Server-Sent Events ---------- */
  const CLIENT_ID = Math.random().toString(36).slice(2) + Date.now().toString(36);
  let live=false, firstEvent=true;

  function connect(){
    const es = new EventSource("/events");
    es.onopen = ()=>{ live=true; updateModeNote(); };
    es.onerror = ()=>{ live=false; updateModeNote(); }; // EventSource auto-reconnects
    es.onmessage = (e)=>{
      let m; try{ m=JSON.parse(e.data); }catch(err){ return; }
      if(!m || !m.state) return;
      if(m.sender===CLIENT_ID) return;        // our own move, already rendered
      const isInitial = firstEvent; firstEvent=false;
      applyRemote(m.state, isInitial);
    };
  }

  function updateModeNote(){
    const note=$("modeNote");
    note.classList.toggle("live", live);
    note.textContent = live
      ? "Live — moves sync to everyone on this link."
      : "Reconnecting…";
  }

  function syncPublish(state){
    fetch("/state", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({sender:CLIENT_ID, state})
    }).catch(()=>{});
  }

  function currentState(phase, lastEvent){
    return { phase, N, players, hE, vE, boxes, turn, claimed, lastEvent: lastEvent || null };
  }

  function applyRemote(st, isInitial){
    if(!st.phase || st.phase==="setup" || !st.players){
      backToSetup();
      renderNames();
      return;
    }
    players=st.players; N=st.N; hE=st.hE; vE=st.vE; boxes=st.boxes;
    turn=st.turn; claimed=st.claimed; over=(st.phase==="over");
    enterGame();
    const ev=st.lastEvent;
    if(!isInitial && ev && ev.type==="score" && players[ev.pi]){
      showScoreToast(ev.pi, ev.count, ev.phrase||"Boxed it!");
      if(ev.boxes) requestAnimationFrame(()=>ev.boxes.forEach(b=>burstAtBox(b[0],b[1],players[ev.pi].color)));
    }
    if(over) setTimeout(showGameOver, 600);
    else $("overlay").classList.remove("show");
  }

  /* ---------- setup state ---------- */
  let playerCount = 2;
  let dealtColors = shuffle(COLORS.slice());
  let dotsPerSide = 6;

  function shuffle(a){
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    return a;
  }

  function renderNames(){
    const wrap = $("names");
    const prev = [...wrap.querySelectorAll("input")].map(i=>i.value);
    wrap.innerHTML = "";
    for(let i=0;i<playerCount;i++){
      const row = document.createElement("div");
      row.className = "name-row";
      const sw = document.createElement("span");
      sw.className = "swatch";
      sw.style.background = dealtColors[i];
      const inp = document.createElement("input");
      inp.maxLength = 16;
      inp.placeholder = "Player " + (i+1);
      inp.value = prev[i] || "";
      inp.setAttribute("aria-label","Name of player " + (i+1));
      row.append(sw, inp);
      wrap.append(row);
    }
  }

  $("minus").addEventListener("click", ()=>{ if(playerCount>2){playerCount--; redeal();} });
  $("plus").addEventListener("click", ()=>{ if(playerCount<6){playerCount++; redeal();} });
  function redeal(){
    dealtColors = shuffle(COLORS.slice());
    $("pcount").textContent = playerCount;
    renderNames();
  }

  $("lenGrid").addEventListener("click", (e)=>{
    const card = e.target.closest(".len-card");
    if(!card) return;
    [...$("lenGrid").children].forEach(c=>c.setAttribute("aria-pressed","false"));
    card.setAttribute("aria-pressed","true");
    dotsPerSide = +card.dataset.dots;
  });

  /* ---------- game state ---------- */
  let players=[], N=6, hE=[], vE=[], boxes=[], turn=0, claimed=0, over=false;
  let myIdx = -1; // -1 = pass & play (anyone can move from this screen)
  const M=42, S=64; // svg margin & spacing
  const edgeEls = { h:[], v:[] };

  $("startBtn").addEventListener("click", ()=>{
    const inputs=[...$("names").querySelectorAll("input")];
    players = inputs.map((inp,i)=>({
      name:(inp.value.trim()||("Player "+(i+1))),
      color:dealtColors[i],
      initial:(inp.value.trim()||("P"+(i+1)))[0].toUpperCase(),
      score:0
    }));
    N = dotsPerSide;
    freshBoardState();
    enterGame();
    syncPublish(currentState("playing", {type:"start"}));
  });

  $("restartBtn").addEventListener("click", ()=>{
    backToSetup();
    syncPublish({phase:"setup"});
  });
  $("newBtn").addEventListener("click", ()=>{
    $("overlay").classList.remove("show");
    backToSetup();
    syncPublish({phase:"setup"});
  });
  $("againBtn").addEventListener("click", ()=>{
    $("overlay").classList.remove("show");
    players.forEach(p=>p.score=0);
    freshBoardState();
    enterGame();
    syncPublish(currentState("playing", {type:"start"}));
  });

  function freshBoardState(){
    hE = Array.from({length:N},()=>Array(N-1).fill(-1));
    vE = Array.from({length:N-1},()=>Array(N).fill(-1));
    boxes = Array.from({length:N-1},()=>Array(N-1).fill(-1));
    turn=0; claimed=0; over=false;
  }

  function backToSetup(){
    $("overlay").classList.remove("show");
    $("screen-game").style.display="none";
    $("screen-setup").style.display="";
  }

  function enterGame(){
    buildBoard();
    paintExisting();
    populateMeSel();
    setTurn(turn);
    renderPanel();
    $("screen-setup").style.display="none";
    $("screen-game").style.display="block";
  }

  function px(c){ return M + c*S; }

  function buildBoard(){
    const svg = $("board");
    const size = M*2 + (N-1)*S;
    svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
    svg.innerHTML = "";
    const ns = "http://www.w3.org/2000/svg";

    const boxLayer = document.createElementNS(ns,"g");
    boxLayer.id = "boxLayer";
    svg.append(boxLayer);

    edgeEls.h = Array.from({length:N},()=>Array(N-1).fill(null));
    edgeEls.v = Array.from({length:N-1},()=>Array(N).fill(null));

    for(let r=0;r<N;r++) for(let c=0;c<N-1;c++) svg.append(makeEdge("h",r,c, px(c),px(r), px(c+1),px(r)));
    for(let r=0;r<N-1;r++) for(let c=0;c<N;c++) svg.append(makeEdge("v",r,c, px(c),px(r), px(c),px(r+1)));

    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      const d=document.createElementNS(ns,"circle");
      d.setAttribute("class","dot");
      d.setAttribute("cx",px(c)); d.setAttribute("cy",px(r)); d.setAttribute("r",7);
      svg.append(d);
    }
  }

  function paintExisting(){
    for(let r=0;r<N;r++) for(let c=0;c<N-1;c++) if(hE[r][c]!==-1) paintEdge("h",r,c,hE[r][c],false);
    for(let r=0;r<N-1;r++) for(let c=0;c<N;c++) if(vE[r][c]!==-1) paintEdge("v",r,c,vE[r][c],false);
    for(let r=0;r<N-1;r++) for(let c=0;c<N-1;c++){
      if(boxes[r][c]!==-1) drawBox(r,c,boxes[r][c],false);
    }
  }

  function makeEdge(type,r,c,x1,y1,x2,y2){
    const ns="http://www.w3.org/2000/svg";
    const g=document.createElementNS(ns,"g");
    g.setAttribute("class","edge");
    const hit=document.createElementNS(ns,"line");
    hit.setAttribute("class","hit");
    const vis=document.createElementNS(ns,"line");
    vis.setAttribute("class","stroke");
    for(const l of [hit,vis]){
      l.setAttribute("x1",x1); l.setAttribute("y1",y1);
      l.setAttribute("x2",x2); l.setAttribute("y2",y2);
    }
    hit.setAttribute("tabindex","0");
    hit.setAttribute("role","button");
    hit.setAttribute("aria-label",(type==="h"?"Horizontal":"Vertical")+" line, row "+(r+1)+", column "+(c+1));
    const play=()=>tryMove(type,r,c);
    hit.addEventListener("click",play);
    hit.addEventListener("keydown",(e)=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();play();} });
    g.append(hit,vis);
    edgeEls[type][r][c] = g;
    return g;
  }

  function paintEdge(type,r,c,pi,animate){
    const g = edgeEls[type][r][c];
    if(!g) return;
    const vis = g.querySelector(".stroke");
    const hit = g.querySelector(".hit");
    g.classList.add("owned");
    hit.removeAttribute("tabindex");
    vis.style.stroke = players[pi].color;
    if(animate && !REDUCED){
      vis.style.strokeDasharray = S;
      vis.animate([{strokeDashoffset:S},{strokeDashoffset:0}],{duration:160,easing:"ease-out",fill:"forwards"});
      vis.style.strokeDashoffset = 0;
    }
  }

  function tryMove(type,r,c){
    if(over) return;
    const store = type==="h"?hE:vE;
    if(store[r][c] !== -1) return;
    if(myIdx >= 0 && myIdx !== turn){
      plainToast("Hold on — it's " + players[turn].name + "'s move.");
      return;
    }
    store[r][c] = turn;
    paintEdge(type,r,c,turn,true);
    const p = players[turn];

    const done=[];
    const cand = type==="h" ? [[r-1,c],[r,c]] : [[r,c-1],[r,c]];
    for(const [br,bc] of cand){
      if(br<0||bc<0||br>=N-1||bc>=N-1) continue;
      if(boxes[br][bc]===-1 && boxComplete(br,bc)) done.push([br,bc]);
    }

    let lastEvent = {type:"move"};
    if(done.length){
      p.score += done.length;
      claimed += done.length;
      done.forEach(([br,bc])=>{ boxes[br][bc]=turn; drawBox(br,bc,turn,true); });
      const phrase = PHRASES[Math.floor(Math.random()*PHRASES.length)];
      lastEvent = {type:"score", pi:turn, count:done.length, phrase, boxes:done};
      showScoreToast(turn, done.length, phrase);
      renderPanel();
      if(claimed === (N-1)*(N-1)){
        over=true;
        syncPublish(currentState("over", lastEvent));
        setTimeout(showGameOver, 900);
        return;
      }
      setTurn(turn); // extra turn
    } else {
      setTurn((turn+1)%players.length);
      renderPanel();
    }
    syncPublish(currentState("playing", lastEvent));
  }

  function boxComplete(r,c){
    return hE[r][c]!==-1 && hE[r+1][c]!==-1 && vE[r][c]!==-1 && vE[r][c+1]!==-1;
  }

  function drawBox(r,c,pi,animate){
    const ns="http://www.w3.org/2000/svg";
    const p=players[pi];
    const g=document.createElementNS(ns,"g");
    const rect=document.createElementNS(ns,"rect");
    rect.setAttribute("x",px(c)+6); rect.setAttribute("y",px(r)+6);
    rect.setAttribute("width",S-12); rect.setAttribute("height",S-12);
    rect.setAttribute("rx",8);
    rect.setAttribute("fill",p.color);
    rect.setAttribute("opacity","0.16");
    const t=document.createElementNS(ns,"text");
    t.setAttribute("class","box-initial");
    t.setAttribute("x",px(c)+S/2); t.setAttribute("y",px(r)+S/2);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("dominant-baseline","central");
    t.setAttribute("font-size",S*0.56);
    t.setAttribute("fill",p.color);
    t.textContent=p.initial;
    g.append(rect,t);
    $("boxLayer").append(g);
    if(animate && !REDUCED){
      g.style.transformOrigin = (px(c)+S/2)+"px "+(px(r)+S/2)+"px";
      g.animate([{transform:"scale(.3)",opacity:0},{transform:"scale(1.12)",opacity:1,offset:.7},{transform:"scale(1)",opacity:1}],
        {duration:320,easing:"ease-out"});
      burstAtBox(r,c,p.color);
    }
  }

  /* ---------- effects ---------- */
  const PHRASES=["Boxed it!","Square secured!","That one's mine!","Snapped it up!","Claimed!","Fenced in!","Got one!"];
  let toastTimer=null;

  function showScoreToast(pi,count,phrase){
    const p=players[pi];
    const pts = count>1 ? `Double! +${count}` : "+1";
    const toast=$("toast");
    toast.style.setProperty("--toast-c", p.color);
    toast.innerHTML = `${escapeHtml(p.name)} — ${escapeHtml(phrase)} <span class="plus">${pts} · extra turn</span>`;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toast.classList.remove("show"), 1700);
  }

  function plainToast(msg){
    const toast=$("toast");
    toast.style.removeProperty("--toast-c");
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toast.classList.remove("show"), 2000);
  }

  function burstAtBox(r,c,color){
    if(REDUCED) return;
    const svg=$("board"), frame=$("boardFrame");
    const fr=frame.getBoundingClientRect(), sr=svg.getBoundingClientRect();
    const size = M*2 + (N-1)*S;
    const scale = sr.width/size;
    const cx = sr.left - fr.left + (px(c)+S/2)*scale;
    const cy = sr.top - fr.top + (px(r)+S/2)*scale;
    for(let i=0;i<14;i++){
      const s=document.createElement("span");
      s.className="particle";
      s.style.background=color;
      s.style.left=cx+"px"; s.style.top=cy+"px";
      frame.append(s);
      const ang=Math.random()*Math.PI*2, dist=40+Math.random()*55;
      const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
      s.animate(
        [{transform:"translate(0,0) rotate(0deg)",opacity:1},
         {transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*360-180}deg)`,opacity:0}],
        {duration:520+Math.random()*250,easing:"cubic-bezier(.2,.7,.4,1)"}
      ).onfinish=()=>s.remove();
    }
  }

  /* ---------- identity ---------- */
  function populateMeSel(){
    const sel=$("meSel");
    sel.innerHTML="";
    const opt=document.createElement("option");
    opt.value="-1"; opt.textContent="Pass & play (anyone)";
    sel.append(opt);
    players.forEach((p,i)=>{
      const o=document.createElement("option");
      o.value=String(i); o.textContent=p.name;
      sel.append(o);
    });
    let saved=null;
    try{ saved = localStorage.getItem("boxedin-me"); }catch(e){}
    if(saved!==null){
      const idx = players.findIndex(p=>p.name===saved);
      if(idx>=0){ myIdx=idx; sel.value=String(idx); }
      else { myIdx=-1; sel.value="-1"; }
    } else { myIdx=-1; sel.value="-1"; }
    sel.onchange=()=>{
      myIdx = +sel.value;
      try{
        if(myIdx>=0) localStorage.setItem("boxedin-me", players[myIdx].name);
        else localStorage.removeItem("boxedin-me");
      }catch(e){}
    };
  }

  /* ---------- panel & turn ---------- */
  function setTurn(i){
    turn=i;
    const p=players[i];
    $("board").style.setProperty("--turn",p.color);
    document.documentElement.style.setProperty("--turn",p.color);
    $("turnBanner").innerHTML =
      `<span class="swatch" style="background:${p.color}"></span>
       <span>Your move,</span><span class="turn-name" style="color:${p.color}">${escapeHtml(p.name)}</span>`;
    renderPanel();
  }

  function renderPanel(){
    const total=(N-1)*(N-1);
    $("claimedNote").textContent = claimed+" of "+total+" squares claimed";
    const wrap=$("pcards");
    wrap.innerHTML="";
    players.forEach((p,i)=>{
      const card=document.createElement("div");
      card.className="pcard"+(i===turn&&!over?" active":"");
      card.style.setProperty("--pc",p.color);
      card.innerHTML =
        `<div class="rowtop">
           <span class="swatch" style="background:${p.color}"></span>
           <span class="pname">${escapeHtml(p.name)}</span>
           <span class="score">${p.score}</span>
         </div>
         <div class="tally">${"<i></i>".repeat(p.score)}</div>
         <div class="turn-tag">Playing now</div>`;
      wrap.append(card);
    });
  }

  /* ---------- game over ---------- */
  function showGameOver(){
    const sorted=[...players].sort((a,b)=>b.score-a.score);
    const top=sorted[0].score;
    const winners=sorted.filter(p=>p.score===top);
    $("winnerLine").textContent = winners.length>1
      ? "It's a tie between "+winners.map(w=>w.name).join(" & ")+"!"
      : sorted[0].name+" takes the grid with "+top+" squares!";
    const ol=$("standings");
    ol.innerHTML="";
    sorted.forEach(p=>{
      const li=document.createElement("li");
      li.innerHTML=`<span class="swatch" style="background:${p.color}"></span>
        <span class="s-name">${escapeHtml(p.name)}</span><span>${p.score}</span>`;
      ol.append(li);
    });
    $("overlay").classList.add("show");
    if(!REDUCED){
      const frame=$("boardFrame"), fr=frame.getBoundingClientRect();
      const cols=players.map(p=>p.color);
      for(let i=0;i<40;i++){
        setTimeout(()=>{
          const s=document.createElement("span");
          s.className="particle";
          s.style.background=cols[i%cols.length];
          s.style.left=(Math.random()*fr.width)+"px"; s.style.top="-10px";
          frame.append(s);
          s.animate([{transform:"translateY(0) rotate(0)",opacity:1},
                     {transform:`translateY(${fr.height*0.9}px) rotate(${300+Math.random()*300}deg)`,opacity:0}],
                    {duration:1400+Math.random()*800,easing:"ease-in"}).onfinish=()=>s.remove();
        }, i*35);
      }
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
  }

  renderNames();
  connect();
})();
</script>
