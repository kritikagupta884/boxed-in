<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boxed In</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Caveat:wght@600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
  :root{
    --paper:#FBFAF5;
    --graph:#DCE6EF;
    --card:#FFFFFF;
    --ink:#28313C;
    --ink-soft:#5C6873;
    --ink-faint:#93A0AC;
    --dot:#39434E;
    --rule:#E3E9EF;
    --btn:#30588C;
    --btn-ink:#FFFFFF;
    --warn:#D14A2B;
    --shadow:0 2px 10px rgba(40,49,60,.08);
    --turn:#E4572E;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B222B; --graph:#28323E; --card:#232D38;
      --ink:#EAEFF4; --ink-soft:#A2AFBC; --ink-faint:#6E7B88;
      --dot:#DCE4EC; --rule:#33404D; --btn:#7FA8D9; --btn-ink:#14202E;
      --warn:#FF8A6A; --shadow:0 2px 12px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B222B; --graph:#28323E; --card:#232D38;
    --ink:#EAEFF4; --ink-soft:#A2AFBC; --ink-faint:#6E7B88;
    --dot:#DCE4EC; --rule:#33404D; --btn:#7FA8D9; --btn-ink:#14202E;
    --warn:#FF8A6A; --shadow:0 2px 12px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{
    margin:0; color:var(--ink);
    font-family:"Nunito Sans","Segoe UI",system-ui,sans-serif;
    background:
      linear-gradient(var(--graph) 1px, transparent 1px),
      linear-gradient(90deg, var(--graph) 1px, transparent 1px),
      var(--paper);
    background-size:28px 28px,28px 28px,auto;
    min-height:100vh;
  }
  main{max-width:1080px;margin:0 auto;padding:26px 20px 56px}
  h1{
    font-family:"Caprasimo","Georgia",serif;font-weight:400;
    font-size:clamp(2.1rem,5vw,3.1rem);letter-spacing:.5px;margin:0;text-wrap:balance;
  }
  .tagline{color:var(--ink-soft);margin:6px 0 0;font-size:1.02rem}
  header.masthead{text-align:center;margin-bottom:24px}

  .card{
    background:var(--card);border:1px solid var(--rule);border-radius:14px;
    box-shadow:var(--shadow);max-width:560px;margin:0 auto;padding:26px 28px 30px;
  }
  .step-label{
    font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-faint);margin:22px 0 10px;
  }
  .step-label:first-child{margin-top:0}
  .stepper{display:flex;align-items:center;gap:16px}
  .stepper button{
    width:40px;height:40px;border-radius:50%;
    border:1.5px solid var(--rule);background:var(--card);color:var(--ink);
    font-size:1.3rem;font-weight:800;cursor:pointer;line-height:1;
  }
  .stepper button:hover{border-color:var(--btn)}
  .stepper .count{
    font-family:"Caprasimo",serif;font-size:1.8rem;min-width:2ch;text-align:center;
    font-variant-numeric:tabular-nums;
  }
  button:focus-visible, input:focus-visible, a:focus-visible{
    outline:2px solid var(--btn);outline-offset:2px;
  }
  .hint{font-size:.85rem;color:var(--ink-soft);margin:10px 0 0}
  .len-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .len-card{
    border:1.5px solid var(--rule);border-radius:11px;background:var(--paper);
    color:var(--ink);padding:14px 10px;cursor:pointer;text-align:center;font:inherit;
  }
  .len-card .mins{font-family:"Caprasimo",serif;font-size:1.5rem;display:block}
  .len-card .dots-info{display:block;font-size:.8rem;color:var(--ink-soft);margin-top:4px}
  .len-card[aria-pressed="true"]{border-color:var(--btn);box-shadow:0 0 0 1.5px var(--btn) inset}
  .btn{
    display:block;width:100%;margin-top:26px;padding:14px;border:none;border-radius:11px;
    cursor:pointer;background:var(--btn);color:var(--btn-ink);
    font-family:"Caprasimo",serif;font-size:1.15rem;letter-spacing:.4px;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
  .ghost-btn{
    display:block;width:100%;margin-top:8px;padding:10px;border-radius:10px;cursor:pointer;
    background:none;border:1.5px solid var(--rule);color:var(--ink-soft);font:inherit;font-weight:700;
  }
  .ghost-btn:hover{border-color:var(--btn);color:var(--ink)}

  /* ---------- lobby ---------- */
  .link-row{display:flex;gap:8px;margin-top:10px}
  .link-row input{
    flex:1;padding:11px 12px;border-radius:9px;border:1.5px solid var(--rule);
    background:var(--paper);color:var(--ink);font:inherit;font-size:.9rem;
  }
  .link-row button{
    padding:0 16px;border-radius:9px;border:1.5px solid var(--btn);
    background:var(--btn);color:var(--btn-ink);font:inherit;font-weight:800;cursor:pointer;white-space:nowrap;
  }
  .name-entry{display:flex;gap:8px;margin-top:10px}
  .name-entry input{
    flex:1;padding:12px;border-radius:9px;border:1.5px solid var(--rule);
    background:var(--paper);color:var(--ink);font:inherit;font-weight:600;
  }
  .seat-list{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
  .seat-list li{
    display:flex;align-items:center;gap:10px;padding:10px 12px;
    border:1.5px solid var(--rule);border-radius:10px;font-weight:700;
  }
  .seat-list li.empty{border-style:dashed;color:var(--ink-faint);font-weight:600}
  .seat-list .swatch{width:20px;height:20px;border-radius:6px;flex:none}
  .seat-list .seat-no{
    font-size:.72rem;font-weight:800;color:var(--ink-faint);letter-spacing:.1em;margin-left:auto;
  }
  .seat-list .you{
    font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--btn);margin-left:auto;
  }
  .waiting{
    text-align:center;margin:18px 0 0;font-family:"Caveat",cursive;
    font-size:1.5rem;font-weight:700;color:var(--ink-soft);
  }
  .dots-anim::after{content:"";animation:dots 1.4s steps(4,end) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

  /* ---------- game ---------- */
  #screen-game{display:none}
  .game-wrap{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
  .board-col{flex:1 1 420px;max-width:640px;min-width:300px}
  .board-frame{
    position:relative;background:var(--card);border:1px solid var(--rule);
    border-radius:16px;box-shadow:var(--shadow);padding:12px;
  }
  svg#board{display:block;width:100%;height:auto;touch-action:manipulation}

  .turn-bar{margin:0 0 12px}
  .turn-line{
    display:flex;align-items:center;gap:10px;justify-content:center;
    font-weight:700;font-size:1.05rem;margin-bottom:8px;flex-wrap:wrap;
  }
  .turn-line .swatch{width:18px;height:18px;border-radius:5px}
  .turn-line .turn-name{font-family:"Caveat",cursive;font-size:1.55rem;font-weight:700}
  .clock{
    font-family:"Caprasimo",serif;font-size:1.15rem;font-variant-numeric:tabular-nums;
    min-width:3.2ch;text-align:right;
  }
  .clock.low{color:var(--warn)}
  .timer-track{height:6px;border-radius:99px;background:var(--rule);overflow:hidden}
  .timer-fill{
    height:100%;border-radius:99px;background:var(--turn);
    width:100%;transition:width .25s linear;
  }
  .timer-fill.low{background:var(--warn)}

  .edge .hit{stroke:transparent;stroke-width:22;cursor:pointer}
  .edge .stroke{stroke:transparent;stroke-width:7;stroke-linecap:round;pointer-events:none}
  .edge:not(.owned).live:hover .stroke,
  .edge:not(.owned).live .hit:focus-visible + .stroke{stroke:var(--turn);opacity:.4}
  .edge:not(.live) .hit{cursor:default}
  .edge.owned .hit{cursor:default}
  .edge .hit:focus{outline:none}
  circle.dot{fill:var(--dot)}
  .box-initial{font-family:"Caveat",cursive;font-weight:700;user-select:none;pointer-events:none}

  /* ---------- scorecard ---------- */
  .panel{
    flex:0 1 300px;min-width:270px;background:var(--card);
    border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);padding:18px;
  }
  .panel h2{margin:0 0 4px;font-family:"Caprasimo",serif;font-weight:400;font-size:1.25rem}
  .claimed-note{font-size:.83rem;color:var(--ink-soft);margin:0 0 14px;font-variant-numeric:tabular-nums}
  .score-table{width:100%;border-collapse:collapse;font-size:.9rem}
  .score-table th{
    text-align:left;font-size:.66rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-faint);padding:0 6px 8px;border-bottom:1.5px solid var(--rule);
  }
  .score-table th.num, .score-table td.num{text-align:right}
  .score-table td{padding:10px 6px;border-bottom:1px solid var(--rule);vertical-align:middle}
  .score-table tr:last-child td{border-bottom:none}
  .score-table tr.active td{background:color-mix(in srgb, var(--rowc) 12%, transparent)}
  .who{display:flex;align-items:center;gap:8px}
  .who .swatch{width:16px;height:16px;border-radius:5px;flex:none}
  .who .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:11ch}
  .who .me{font-size:.6rem;font-weight:800;color:var(--ink-faint);letter-spacing:.08em}
  .tally-cell{width:44%}
  .tally-groups{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:flex-end}
  .tally-groups svg{display:block;overflow:visible}
  .pts{
    font-family:"Caprasimo",serif;font-size:1.3rem;font-variant-numeric:tabular-nums;
  }

  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:50%;top:22px;transform:translate(-50%,-16px);
    background:var(--ink);color:var(--paper);padding:10px 22px;border-radius:999px;
    box-shadow:var(--shadow);font-family:"Caveat",cursive;font-size:1.45rem;font-weight:700;
    opacity:0;pointer-events:none;z-index:60;white-space:nowrap;
    transition:opacity .18s, transform .18s;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast .plus{color:var(--toast-c,#FFD166);margin-left:6px}
  .particle{position:absolute;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:50}

  /* ---------- game over ---------- */
  #overlay{
    position:fixed;inset:0;background:rgba(20,26,33,.55);
    display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  #overlay.show{display:flex}
  .over-card{
    background:var(--card);border:1px solid var(--rule);border-radius:18px;box-shadow:var(--shadow);
    padding:30px 32px;max-width:420px;width:100%;text-align:center;
  }
  .over-card h2{font-family:"Caprasimo",serif;font-weight:400;font-size:2rem;margin:0}
  .winner-line{font-family:"Caveat",cursive;font-size:1.7rem;font-weight:700;margin:6px 0 18px}
  .standings{list-style:none;padding:0;margin:0;text-align:left}
  .standings li{
    display:flex;align-items:center;gap:10px;padding:8px 4px;
    border-bottom:1px dashed var(--rule);font-weight:700;font-variant-numeric:tabular-nums;
  }
  .standings li:last-child{border-bottom:none}
  .standings .swatch{width:16px;height:16px;border-radius:5px}
  .standings .s-name{flex:1}

  .conn{
    text-align:center;font-size:.78rem;color:var(--ink-faint);margin-top:18px;
  }
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<main>
  <header class="masthead">
    <h1>Boxed In</h1>
    <p class="tagline">Dots &amp; squares, straight off the back page of a maths notebook.</p>
  </header>

  <!-- 1. HOST SETUP -->
  <section id="screen-setup" style="display:none">
    <div class="card">
      <div class="step-label">1 · How many players</div>
      <div class="stepper">
        <button type="button" id="minus" aria-label="Fewer players">−</button>
        <span class="count" id="pcount">2</span>
        <button type="button" id="plus" aria-label="More players">+</button>
        <span class="hint" style="margin:0">2–6 players</span>
      </div>
      <p class="hint">Players type their own names when they open your link. Colours are dealt at random.</p>

      <div class="step-label">2 · Length of game</div>
      <div class="len-grid" id="lenGrid">
        <button type="button" class="len-card" data-dots="6" aria-pressed="true">
          <span class="mins">10 min</span><span class="dots-info">6×6 dots · 25 squares</span>
        </button>
        <button type="button" class="len-card" data-dots="8" aria-pressed="false">
          <span class="mins">15 min</span><span class="dots-info">8×8 dots · 49 squares</span>
        </button>
        <button type="button" class="len-card" data-dots="10" aria-pressed="false">
          <span class="mins">20 min</span><span class="dots-info">10×10 dots · 81 squares</span>
        </button>
      </div>

      <button type="button" class="btn" id="createBtn">Create game &amp; get link</button>
    </div>
  </section>

  <!-- 2. LOBBY -->
  <section id="screen-lobby" style="display:none">
    <div class="card">
      <div class="step-label">Share this link</div>
      <div class="link-row">
        <input id="shareLink" type="text" readonly aria-label="Game link">
        <button type="button" id="copyBtn">Copy</button>
      </div>

      <div id="nameBlock">
        <div class="step-label">Your name</div>
        <div class="name-entry">
          <input id="nameInput" maxlength="16" placeholder="Type your name" aria-label="Your name">
          <button type="button" id="joinBtn" class="link-row-btn" style="padding:0 18px;border-radius:9px;border:1.5px solid var(--btn);background:var(--btn);color:var(--btn-ink);font:inherit;font-weight:800;cursor:pointer">Join</button>
        </div>
        <p class="hint" id="joinHint"></p>
      </div>

      <div class="step-label" style="margin-top:22px">Players</div>
      <ul class="seat-list" id="seatList"></ul>
      <p class="waiting dots-anim" id="waitingNote"></p>
      <button type="button" class="ghost-btn" id="lobbyResetBtn">↺ Cancel &amp; set up a new game</button>
    </div>
  </section>

  <!-- 3. GAME -->
  <section id="screen-game">
    <div class="turn-bar">
      <div class="turn-line" id="turnLine"></div>
      <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
    </div>
    <div class="game-wrap">
      <div class="board-col">
        <div class="board-frame" id="boardFrame">
          <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </div>
      <aside class="panel">
        <h2>Scorecard</h2>
        <p class="claimed-note" id="claimedNote"></p>
        <table class="score-table">
          <thead>
            <tr><th>Player</th><th class="tally-cell">Tally</th><th class="num">Pts</th></tr>
          </thead>
          <tbody id="scoreBody"></tbody>
        </table>
        <p class="conn" id="connNote"></p>
        <button type="button" class="ghost-btn" id="gameResetBtn">↺ New game</button>
      </aside>
    </div>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<div id="overlay">
  <div class="over-card">
    <h2>Game over</h2>
    <p class="winner-line" id="winnerLine"></p>
    <ol class="standings" id="standings"></ol>
    <button type="button" class="btn" id="againBtn">Set up a new game</button>
  </div>
</div>
<script>
(function(){
  "use strict";
  const $ = (id)=>document.getElementById(id);
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- local identity ---------- */
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

  let myToken  = lsGet("boxedin-token");
  let mySeat   = lsGet("boxedin-seat") !== null ? +lsGet("boxedin-seat") : -1;
  let myGameId = lsGet("boxedin-game");

  function forgetSeat(){
    lsDel("boxedin-token"); lsDel("boxedin-seat"); lsDel("boxedin-game");
    myToken = null; mySeat = -1; myGameId = null;
  }

  /* ---------- state ---------- */
  let S = null;              // latest server state
  let live = false;
  let skew = 0;              // serverNow - clientNow
  let renderedKey = "";      // board signature, to avoid needless rebuilds
  let seenEventId = "";
  const M = 42, SP = 64;     // svg margin & dot spacing
  const edgeEls = { h:[], v:[] };

  /* ---------- host setup ---------- */
  let seats = 2, dots = 6;

  $("minus").addEventListener("click", ()=>{ if(seats>2){ seats--; $("pcount").textContent=seats; } });
  $("plus").addEventListener("click", ()=>{ if(seats<6){ seats++; $("pcount").textContent=seats; } });

  $("lenGrid").addEventListener("click", (e)=>{
    const card = e.target.closest(".len-card");
    if(!card) return;
    [...$("lenGrid").children].forEach(c=>c.setAttribute("aria-pressed","false"));
    card.setAttribute("aria-pressed","true");
    dots = +card.dataset.dots;
  });

  $("createBtn").addEventListener("click", ()=>{
    forgetSeat();
    post("/create", {seats, dots});
  });

  /* ---------- lobby ---------- */
  $("shareLink").value = location.origin + location.pathname;

  $("copyBtn").addEventListener("click", async ()=>{
    const link = $("shareLink").value;
    try{
      await navigator.clipboard.writeText(link);
      $("copyBtn").textContent = "Copied";
    }catch(e){
      $("shareLink").select();
      $("copyBtn").textContent = "Press ⌘C";
    }
    setTimeout(()=>{ $("copyBtn").textContent="Copy"; }, 1800);
  });

  $("joinBtn").addEventListener("click", doJoin);
  $("nameInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") doJoin(); });

  async function doJoin(){
    const name = $("nameInput").value.trim();
    if(!name){ $("joinHint").textContent = "Type a name first so everyone knows who's who."; return; }
    $("joinBtn").disabled = true;
    const res = await post("/join", {name, token:myToken});
    $("joinBtn").disabled = false;
    if(res && res.error === "full"){ $("joinHint").textContent = "All seats are taken for this game."; return; }
    if(res && res.error === "not_open"){ $("joinHint").textContent = "This game has already started."; return; }
    if(res && res.token){
      myToken = res.token; mySeat = res.seat;
      myGameId = S ? S.gameId : null;
      lsSet("boxedin-token", myToken);
      lsSet("boxedin-seat", String(mySeat));
      if(myGameId) lsSet("boxedin-game", myGameId);
      $("joinHint").textContent = "";
    }
  }

  $("lobbyResetBtn").addEventListener("click", resetGame);
  $("gameResetBtn").addEventListener("click", resetGame);
  $("againBtn").addEventListener("click", ()=>{ $("overlay").classList.remove("show"); resetGame(); });

  function resetGame(){
    forgetSeat();
    overShown = false;
    post("/reset", {});
  }

  /* ---------- transport ---------- */
  async function post(url, body){
    try{
      const r = await fetch(url, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(body)
      });
      return await r.json();
    }catch(e){ return null; }
  }

  function connect(){
    const es = new EventSource("/events");
    es.onopen = ()=>{ live=true; paintConn(); };
    es.onerror = ()=>{ live=false; paintConn(); };
    es.onmessage = (e)=>{
      let m; try{ m=JSON.parse(e.data); }catch(err){ return; }
      if(!m || !m.state) return;
      live = true;
      skew = m.state.now - Date.now();
      apply(m.state);
    };
  }

  function paintConn(){
    $("connNote").textContent = live ? "Live · synced with everyone" : "Reconnecting…";
  }

  /* ---------- routing ---------- */
  function apply(st){
    const prev = S;
    S = st;

    // Identity belongs to one game only — a new game means a fresh seat.
    if(st.phase === "setup"){
      forgetSeat();
      overShown = false;
    }else if(myGameId && st.gameId && myGameId !== st.gameId){
      forgetSeat();
      overShown = false;
    }

    show("screen-setup", st.phase === "setup");
    show("screen-lobby", st.phase === "lobby");
    show("screen-game",  st.phase === "playing" || st.phase === "over");

    if(st.phase === "setup"){
      $("overlay").classList.remove("show");
      return;
    }
    if(st.phase === "lobby"){ renderLobby(); $("overlay").classList.remove("show"); return; }

    renderGame(prev);
  }

  function show(id, on){ $(id).style.display = on ? "block" : "none"; }

  /* ---------- lobby render ---------- */
  function renderLobby(){
    const joined = S.players.filter(Boolean).length;
    const iAmIn = mySeat >= 0 && S.players[mySeat];
    $("nameBlock").style.display = iAmIn ? "none" : "block";

    const ul = $("seatList");
    ul.innerHTML = "";
    S.players.forEach((p,i)=>{
      const li = document.createElement("li");
      if(p){
        li.innerHTML =
          `<span class="swatch" style="background:${p.color}"></span>
           <span>${esc(p.name)}</span>` +
          (i===mySeat ? `<span class="you">You</span>` : `<span class="seat-no">SEAT ${i+1}</span>`);
      }else{
        li.className = "empty";
        li.innerHTML = `<span class="swatch" style="background:var(--rule)"></span>
                        <span>Waiting for a player…</span><span class="seat-no">SEAT ${i+1}</span>`;
      }
      ul.append(li);
    });

    const left = S.seats - joined;
    $("waitingNote").textContent = left > 0
      ? `${joined} of ${S.seats} joined — waiting for ${left} more`
      : "Everyone's in! Starting";
  }

  /* ---------- game render ---------- */
  function renderGame(prev){
    const key = S.N + ":" + S.seats + ":" + S.players.map(p=>p&&p.name).join(",");
    if(key !== renderedKey){ buildBoard(); renderedKey = key; }

    paintBoard();
    renderScores();
    renderTurnLine();
    paintConn();

    const total = (S.N-1)*(S.N-1);
    $("claimedNote").textContent = S.claimed + " of " + total + " squares claimed";

    // celebrate a newly-scored square exactly once
    const ev = S.lastEvent;
    if(ev && ev.type === "score"){
      const id = ev.pi + ":" + JSON.stringify(ev.boxes) + ":" + S.claimed;
      if(id !== seenEventId){
        seenEventId = id;
        showScoreToast(ev);
        if(ev.boxes) requestAnimationFrame(()=>{
          ev.boxes.forEach(b=>burstAtBox(b[0], b[1], S.players[ev.pi].color));
        });
      }
    }else if(ev && ev.type === "timeout"){
      const id = "t:" + ev.pi + ":" + S.turn + ":" + edgeCount();
      if(id !== seenEventId){
        seenEventId = id;
        plainToast("Out of time — a line was played for " + S.players[ev.pi].name);
      }
    }

    if(S.phase === "over") showGameOver(); else $("overlay").classList.remove("show");
  }

  function edgeCount(){
    let n=0;
    for(const row of S.hE) for(const v of row) if(v!==-1) n++;
    for(const row of S.vE) for(const v of row) if(v!==-1) n++;
    return n;
  }

  function px(c){ return M + c*SP; }
  const NS = "http://www.w3.org/2000/svg";

  function buildBoard(){
    const svg = $("board");
    const N = S.N;
    const size = M*2 + (N-1)*SP;
    svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
    svg.innerHTML = "";

    const boxLayer = document.createElementNS(NS,"g");
    boxLayer.id = "boxLayer";
    svg.append(boxLayer);

    edgeEls.h = Array.from({length:N},()=>Array(N-1).fill(null));
    edgeEls.v = Array.from({length:N-1},()=>Array(N).fill(null));

    for(let r=0;r<N;r++) for(let c=0;c<N-1;c++)
      svg.append(makeEdge("h",r,c, px(c),px(r), px(c+1),px(r)));
    for(let r=0;r<N-1;r++) for(let c=0;c<N;c++)
      svg.append(makeEdge("v",r,c, px(c),px(r), px(c),px(r+1)));

    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      const d = document.createElementNS(NS,"circle");
      d.setAttribute("class","dot");
      d.setAttribute("cx",px(c)); d.setAttribute("cy",px(r)); d.setAttribute("r",7);
      svg.append(d);
    }
    $("boxLayer").dataset.drawn = "";
  }

  function makeEdge(type,r,c,x1,y1,x2,y2){
    const g = document.createElementNS(NS,"g");
    g.setAttribute("class","edge");
    const hit = document.createElementNS(NS,"line");
    hit.setAttribute("class","hit");
    const vis = document.createElementNS(NS,"line");
    vis.setAttribute("class","stroke");
    for(const l of [hit,vis]){
      l.setAttribute("x1",x1); l.setAttribute("y1",y1);
      l.setAttribute("x2",x2); l.setAttribute("y2",y2);
    }
    hit.setAttribute("tabindex","0");
    hit.setAttribute("role","button");
    hit.setAttribute("aria-label",(type==="h"?"Horizontal":"Vertical")+" line, row "+(r+1)+", column "+(c+1));
    const play = ()=>tryMove(type,r,c);
    hit.addEventListener("click", play);
    hit.addEventListener("keydown",(e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); play(); } });
    g.append(hit,vis);
    edgeEls[type][r][c] = g;
    return g;
  }

  // Paint edges/boxes from server state; only touches what changed.
  function paintBoard(){
    const myTurn = (S.phase === "playing" && mySeat >= 0 && mySeat === S.turn);
    for(let r=0;r<S.N;r++) for(let c=0;c<S.N-1;c++) paintEdge("h",r,c,S.hE[r][c],myTurn);
    for(let r=0;r<S.N-1;r++) for(let c=0;c<S.N;c++) paintEdge("v",r,c,S.vE[r][c],myTurn);

    const layer = $("boxLayer");
    const drawn = new Set((layer.dataset.drawn||"").split("|").filter(Boolean));
    for(let r=0;r<S.N-1;r++) for(let c=0;c<S.N-1;c++){
      const owner = S.boxes[r][c];
      const tag = r+","+c;
      if(owner !== -1 && !drawn.has(tag)){
        drawBox(r,c,owner, drawn.size>0 || S.claimed>0);
        drawn.add(tag);
      }
    }
    layer.dataset.drawn = [...drawn].join("|");
  }

  function paintEdge(type,r,c,owner,myTurn){
    const g = edgeEls[type][r][c];
    if(!g) return;
    const vis = g.querySelector(".stroke");
    const hit = g.querySelector(".hit");
    if(owner !== -1){
      if(!g.classList.contains("owned")){
        g.classList.add("owned");
        g.classList.remove("live");
        hit.removeAttribute("tabindex");
        vis.style.stroke = S.players[owner].color;
        if(!REDUCED){
          vis.style.strokeDasharray = SP;
          vis.animate([{strokeDashoffset:SP},{strokeDashoffset:0}],
                      {duration:160,easing:"ease-out",fill:"forwards"});
          vis.style.strokeDashoffset = 0;
        }
      }
    }else{
      g.classList.toggle("live", myTurn);
      if(myTurn) hit.setAttribute("tabindex","0"); else hit.removeAttribute("tabindex");
    }
  }

  function drawBox(r,c,owner,animate){
    const p = S.players[owner];
    const g = document.createElementNS(NS,"g");
    const rect = document.createElementNS(NS,"rect");
    rect.setAttribute("x",px(c)+6); rect.setAttribute("y",px(r)+6);
    rect.setAttribute("width",SP-12); rect.setAttribute("height",SP-12);
    rect.setAttribute("rx",8);
    rect.setAttribute("fill",p.color);
    rect.setAttribute("opacity","0.16");
    const t = document.createElementNS(NS,"text");
    t.setAttribute("class","box-initial");
    t.setAttribute("x",px(c)+SP/2); t.setAttribute("y",px(r)+SP/2);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("dominant-baseline","central");
    t.setAttribute("font-size",SP*0.56);
    t.setAttribute("fill",p.color);
    t.textContent = p.initial;
    g.append(rect,t);
    $("boxLayer").append(g);
    if(animate && !REDUCED){
      g.style.transformOrigin = (px(c)+SP/2)+"px "+(px(r)+SP/2)+"px";
      g.animate([{transform:"scale(.3)",opacity:0},
                 {transform:"scale(1.12)",opacity:1,offset:.7},
                 {transform:"scale(1)",opacity:1}],
                {duration:320,easing:"ease-out"});
    }
  }

  function tryMove(type,r,c){
    if(!S || S.phase !== "playing") return;
    if(mySeat < 0){ plainToast("You're watching this game, not playing it."); return; }
    if(mySeat !== S.turn){ plainToast("Hold on — it's " + S.players[S.turn].name + "'s move."); return; }
    const store = type === "h" ? S.hE : S.vE;
    if(store[r][c] !== -1) return;
    post("/move", {token:myToken, type, r, c});
  }

  /* ---------- turn line & clock ---------- */
  function renderTurnLine(){
    const p = S.players[S.turn];
    if(!p) return;
    document.documentElement.style.setProperty("--turn", p.color);
    const mine = mySeat === S.turn;
    const who = mine
      ? `<span class="turn-name" style="color:${p.color}">Your move</span>`
      : `<span>Waiting on</span><span class="turn-name" style="color:${p.color}">${esc(p.name)}</span>`;
    $("turnLine").innerHTML =
      `<span class="swatch" style="background:${p.color}"></span>${who}
       <span class="clock" id="clock"></span>`;
    tickClock();
  }

  function tickClock(){
    if(!S || S.phase !== "playing" || !S.turnStartedAt){
      $("timerFill").style.width = "0%";
      return;
    }
    const elapsed = (Date.now() + skew) - S.turnStartedAt;
    const left = Math.max(0, S.turnMs - elapsed);
    const secs = Math.ceil(left/1000);
    const pct = Math.max(0, Math.min(100, (left/S.turnMs)*100));
    const clock = $("clock");
    const fill = $("timerFill");
    if(clock){
      clock.textContent = secs + "s";
      clock.classList.toggle("low", secs <= 10);
    }
    fill.style.width = pct + "%";
    fill.classList.toggle("low", secs <= 10);
  }
  setInterval(tickClock, 250);

  /* ---------- scorecard with gate-5 tally ---------- */
  function tallyGroup(count, color){
    // count is 1..5 — four uprights plus a diagonal stroke on the fifth.
    const W = 34, H = 26;
    const parts = [];
    for(let i=0;i<Math.min(count,4);i++){
      const x = 4 + i*7;
      parts.push(`<line x1="${x}" y1="4" x2="${x}" y2="${H-4}" />`);
    }
    if(count === 5){
      parts.push(`<line x1="0" y1="${H-3}" x2="${W-4}" y2="3" />`);
    }
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"
      stroke="${color}" stroke-width="2.4" stroke-linecap="round">${parts.join("")}</svg>`;
  }

  function tallyMarks(score, color){
    if(!score) return `<span style="color:var(--ink-faint);font-size:.85rem">—</span>`;
    const groups = [];
    let left = score;
    while(left > 0){ groups.push(Math.min(5,left)); left -= Math.min(5,left); }
    return groups.map(g=>tallyGroup(g,color)).join("");
  }

  function renderScores(){
    const body = $("scoreBody");
    body.innerHTML = "";
    S.players.forEach((p,i)=>{
      if(!p) return;
      const tr = document.createElement("tr");
      if(i === S.turn && S.phase === "playing") tr.className = "active";
      tr.style.setProperty("--rowc", p.color);
      tr.innerHTML =
        `<td>
           <div class="who">
             <span class="swatch" style="background:${p.color}"></span>
             <span class="nm">${esc(p.name)}</span>
             ${i===mySeat ? '<span class="me">(you)</span>' : ''}
           </div>
         </td>
         <td class="tally-cell"><div class="tally-groups">${tallyMarks(p.score, p.color)}</div></td>
         <td class="num"><span class="pts">${p.score}</span></td>`;
      body.append(tr);
    });
  }

  /* ---------- effects ---------- */
  const PHRASES = ["Boxed it!","Square secured!","Snapped it up!","Claimed!","Fenced in!","Got one!"];
  let toastTimer = null;

  function showScoreToast(ev){
    const p = S.players[ev.pi];
    if(!p) return;
    const pts = ev.count > 1 ? `Double! +${ev.count}` : "+1";
    const phrase = PHRASES[(ev.pi + S.claimed) % PHRASES.length];
    const toast = $("toast");
    toast.style.setProperty("--toast-c", p.color);
    const who = ev.pi === mySeat ? "You" : esc(p.name);
    toast.innerHTML = `${who} — ${phrase} <span class="plus">${pts} · extra turn</span>`;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove("show"), 1700);
  }

  function plainToast(msg){
    const toast = $("toast");
    toast.style.removeProperty("--toast-c");
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove("show"), 2000);
  }

  function burstAtBox(r,c,color){
    if(REDUCED) return;
    const svg = $("board"), frame = $("boardFrame");
    const fr = frame.getBoundingClientRect(), sr = svg.getBoundingClientRect();
    const size = M*2 + (S.N-1)*SP;
    const scale = sr.width/size;
    const cx = sr.left - fr.left + (px(c)+SP/2)*scale;
    const cy = sr.top  - fr.top  + (px(r)+SP/2)*scale;
    for(let i=0;i<14;i++){
      const s = document.createElement("span");
      s.className = "particle";
      s.style.background = color;
      s.style.left = cx+"px"; s.style.top = cy+"px";
      frame.append(s);
      const ang = Math.random()*Math.PI*2, dist = 40+Math.random()*55;
      const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist;
      s.animate(
        [{transform:"translate(0,0) rotate(0deg)",opacity:1},
         {transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*360-180}deg)`,opacity:0}],
        {duration:520+Math.random()*250,easing:"cubic-bezier(.2,.7,.4,1)"}
      ).onfinish = ()=>s.remove();
    }
  }

  /* ---------- game over ---------- */
  let overShown = false;
  function showGameOver(){
    if(overShown) return;
    overShown = true;
    const sorted = S.players.filter(Boolean).slice().sort((a,b)=>b.score-a.score);
    const top = sorted[0].score;
    const winners = sorted.filter(p=>p.score===top);
    $("winnerLine").textContent = winners.length > 1
      ? "It's a tie between " + winners.map(w=>w.name).join(" & ") + "!"
      : sorted[0].name + " takes the grid with " + top + " squares!";
    const ol = $("standings");
    ol.innerHTML = "";
    sorted.forEach(p=>{
      const li = document.createElement("li");
      li.innerHTML = `<span class="swatch" style="background:${p.color}"></span>
        <span class="s-name">${esc(p.name)}</span><span>${p.score}</span>`;
      ol.append(li);
    });
    $("overlay").classList.add("show");
    if(!REDUCED){
      const frame = $("boardFrame"), fr = frame.getBoundingClientRect();
      const cols = S.players.filter(Boolean).map(p=>p.color);
      for(let i=0;i<40;i++){
        setTimeout(()=>{
          const s = document.createElement("span");
          s.className = "particle";
          s.style.background = cols[i%cols.length];
          s.style.left = (Math.random()*fr.width)+"px"; s.style.top = "-10px";
          frame.append(s);
          s.animate([{transform:"translateY(0) rotate(0)",opacity:1},
                     {transform:`translateY(${fr.height*0.9}px) rotate(${300+Math.random()*300}deg)`,opacity:0}],
                    {duration:1400+Math.random()*800,easing:"ease-in"}).onfinish = ()=>s.remove();
        }, i*35);
      }
    }
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
  }

  connect();
})();
</script>
</body>
</html>
